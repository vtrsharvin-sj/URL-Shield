<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Blocked by URL Shield</title>
    <link rel="stylesheet" href="blocked.css">
</head>

<body>
    <div class="card">
        <div class="shield">&#128737;</div>
        <h1>Site blocked</h1>
        <p class="reason" id="reason">This site was blocked.</p>
        <p class="url" id="url"></p>
        <p class="hint">URL Shield stopped this page because it did not pass a
            safety check.</p>
        <button id="back">Go back</button>
    </div>

    <script src="blocked.js"></script>
</body>

</html>
